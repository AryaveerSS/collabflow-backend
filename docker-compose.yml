version: "3.9"

# ================================
# CollabFlow Backend - Docker Compose
# Services: FastAPI App, PostgreSQL, Redis
# ================================

services:

  # ---- FastAPI Application ----
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: collabflow_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres        # override localhost → docker service name
      - REDIS_HOST=redis
    volumes:
      - ./app:/app/app                # hot reload in dev
      - ./uploads:/app/uploads        # persist uploaded files
      - ./logs:/app/logs              # persist logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - collabflow_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ---- PostgreSQL Database ----
  postgres:
    image: postgres:16-alpine
    container_name: collabflow_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-collabflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-collabflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - collabflow_network

  # ---- Redis Cache & Pub/Sub ----
  redis:
    image: redis:7-alpine
    container_name: collabflow_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes   # enable persistence
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - collabflow_network

  # ---- Celery Worker (Background Jobs) ----
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: collabflow_celery
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
    depends_on:
      - postgres
      - redis
    networks:
      - collabflow_network
    command: celery -A app.notifications.background_jobs worker --loglevel=info

  # ---- Celery Flower (Job Monitor UI) ----
  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: collabflow_flower
    restart: unless-stopped
    ports:
      - "5555:5555"
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
      - celery_worker
    networks:
      - collabflow_network
    command: celery -A app.notifications.background_jobs flower --port=5555

# ================================
# Volumes (persistent data)
# ================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ================================
# Network
# ================================
networks:
  collabflow_network:
    driver: bridge